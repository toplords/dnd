title: Allianz Webseite
description: Offizielle Webseite der Allianz
lang: de
baseurl: "/dnd"
url: "https://toplords.github.io"

theme: minima

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: "de"
    values:
      lang: de
      layout: "default"
  - scope:
      path: "en"
    values:
      lang: en
      layout: "default"

# Minima Theme Konfiguration
minima:
  skin: dark
  social_links:
    - platform: github
      user_url: "https://github.com/toplords/dnd"
