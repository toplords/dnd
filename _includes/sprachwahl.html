<div class="sprachwahl-container">
  <label for="sprachauswahl">Language:</label>
  <select id="sprachauswahl" aria-label="Select language">
    <option value="{{ '/de/' | relative_url }}" {% if page.lang == 'de' %}selected{% endif %}>Deutsch</option>
    <option value="{{ '/en/' | relative_url }}" {% if page.lang == 'en' %}selected{% endif %}>English</option>
  </select>
</div>

<script>
  document.getElementById('sprachauswahl').addEventListener('change', function() {
    const selectedLang = this.value;
    if (selectedLang) {
      window.location.href = selectedLang;
    }
  });
</script>
